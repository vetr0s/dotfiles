# Kitty terminal emulator configuration, shared across macOS and Linux.
#
# Platform-specific settings (macOS Option-key handling and key bindings)
# live in macos.conf, pulled in by the include below. KITTY_OS is set by
# kitty itself before parsing config, so this resolves per host with no
# branching. globinclude accepts the missing Linux file without a warning.
# Unlike WezTerm, kitty invented the Kitty
# Keyboard Protocol and always advertises it, so there is no opt-in setting
# for it here.

# Zenbones lacks icons. Route private-use glyphs to Symbols Nerd Font Mono.
# Install fonts manually on each machine.
font_family Zenbones Brainy
font_size 14.0
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Symbols Nerd Font Mono

# Cursor. Vim and Emacs both reshape the cursor per mode with DECSCUSR; this
# is only what an application that says nothing gets.
cursor_shape block
cursor_blink_interval 0

# Transparency
background_opacity 0.92

# Chrome
tab_bar_min_tabs 2
confirm_os_window_close 0

# Scrollback for local terminal windows. Tmux keeps its own larger history.
scrollback_lines 10000

# Vim rings the bell for a failed search and for hitting the end of a buffer.
enable_audio_bell no

# Layout. splits gives WezTerm-style arbitrary directional panes; stack
# backs the zoom binding in macos.conf.
enabled_layouts splits,stack

globinclude ${KITTY_OS}.conf


# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME
