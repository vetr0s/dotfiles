# Kitty terminal emulator configuration.
# Unlike WezTerm, kitty invented the Kitty
# Keyboard Protocol and always advertises it, so there is no opt-in setting
# for it here.

# Route private-use glyphs to Symbols Nerd Font Mono.
# Install fonts manually on each machine.
font_family Iosevka Term
font_size 14.0
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Symbols Nerd Font Mono

# Cursor. Vim and Emacs both reshape the cursor per mode with DECSCUSR; this
# is only what an application that says nothing gets.
cursor_shape block
cursor_blink_interval 0

# Transparency
background_opacity 0.92

# Chrome
tab_bar_min_tabs 2
confirm_os_window_close 0

# Scrollback for local terminal windows. Tmux keeps its own larger history.
scrollback_lines 10000

# Vim rings the bell for a failed search and for hitting the end of a buffer.
enable_audio_bell no

# Layout. splits gives WezTerm-style arbitrary directional panes.
enabled_layouts splits,stack

# Left Option sends Meta. Right Option keeps macOS character composition.
macos_option_as_alt left

# Cmd owns window management because terminal applications do not receive it.
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+h neighboring_window left
map cmd+j neighboring_window down
map cmd+k neighboring_window up
map cmd+l neighboring_window right
map cmd+ctrl+h resize_window narrower 3
map cmd+ctrl+j resize_window shorter 3
map cmd+ctrl+k resize_window taller 3
map cmd+ctrl+l resize_window wider 3
map cmd+z toggle_layout stack
map cmd+x close_window
map cmd+[ previous_tab
map cmd+] next_tab
map cmd+shift+k clear_terminal scrollback active
map cmd+shift+x show_scrollback
map cmd+shift+space kitten hints --type url
map cmd+enter toggle_fullscreen

# BEGIN_KITTY_THEME
# ANSI 1987
include current-theme.conf
# END_KITTY_THEME
