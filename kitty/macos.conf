# macOS-only: Option-key handling and key bindings. Pulled in by
# kitty.conf's `globinclude ${KITTY_OS}.conf`; kitty ignores a missing include,
# so Linux, which has no linux.conf, is unaffected.

# Left Option is Meta; Right Option still composes accented characters. This
# also disables dead-key composition on the left key, since it now sends Alt
# instead of waiting to combine a keystroke into a glyph.
macos_option_as_alt left

# Everything below hangs off Cmd. It is the one modifier macOS never forwards
# to the terminal, so no binding here can shadow a Vim, Emacs or readline key.
# The cost is Cmd+h, which stops hiding the app; Cmd+m still does that.

# Splits. The pane inherits the cwd, which is what tmux's -c did.
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# Focus a pane, hjkl.
map cmd+h neighboring_window left
map cmd+j neighboring_window down
map cmd+k neighboring_window up
map cmd+l neighboring_window right

# Resize a pane. Cmd+Ctrl rather than Cmd+Shift, which clear-scrollback wants
# below. Aerospace holds Cmd+Ctrl+Alt, so it does not collide.
map cmd+ctrl+h resize_window narrower 3
map cmd+ctrl+j resize_window shorter 3
map cmd+ctrl+k resize_window taller 3
map cmd+ctrl+l resize_window wider 3

map cmd+z toggle_layout stack
map cmd+x close_window

# Tabs. Cmd+t, Cmd+w and Cmd+1..9 are already right by default; these are the
# unshifted aliases for the relative motions.
map cmd+[ previous_tab
map cmd+] next_tab

# Displaced by pane focus above.
map cmd+shift+k clear_terminal scrollback active

# Not vim-navigable like WezTerm's copy mode; opens scrollback in $PAGER
# instead, which is kitty's built-in equivalent for browsing and searching.
map cmd+shift+x show_scrollback

# WezTerm's QuickSelect labelled paths, URLs and hashes together. kitty
# splits that across kitten hints: ctrl+shift+e for a URL (bound here to the
# old chord too), ctrl+shift+p>f for a path, ctrl+shift+p>n for path:linenum.
map cmd+shift+space kitten hints --type url

map cmd+enter toggle_fullscreen
