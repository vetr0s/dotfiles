$font = Monospace

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.65
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_family = $font
    font_size = 20
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    outer_color = rgba(7aa2f7ee)
    inner_color = rgba(1a1b26dd)
    font_color = rgba(c0caf5ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Authentication failed
    rounding = 12
    position = 0, -45
    halign = center
    valign = center
}
