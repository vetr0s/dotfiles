# AeroSpace config for the HHKB Pro 2.
# Mod is the RIGHT diamond key, remapped by Karabiner to Cmd+Ctrl+Opt.
# Add physical Shift for the move variants. Tapping the right diamond
# alone still sends a normal Cmd, and the LEFT diamond is untouched.
# Reload after edits with: aerospace reload-config

config-version = 2

start-at-login = true
auto-reload-config = true

# SketchyBar runs as a Homebrew service and may start before AeroSpace.
# Repaint its workspaces once AeroSpace can answer queries.
after-startup-command = [
    'exec-and-forget sketchybar --trigger aerospace_workspace_change',
]

# Keep SketchyBar current without polling for focus changes.
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]
on-focus-changed = [
    'exec-and-forget sketchybar --trigger aerospace_focus_change',
]
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Hidden macOS applications otherwise disappear from the tiling tree.
automatically-unhide-macos-hidden-apps = true

# Version 2 dropped the inference that kept these alive: v1 read the right hand
# side of the workspace bindings below, v2 falls back to nothing. Declared so
# an empty workspace still exists to switch to.
persistent-workspaces = [
    '1', '2', '3', '4', '5',
    '6', '7', '8', '9',
]

# Normalize the tree so focus/move stay predictable.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Tiles split the workspace. Accordion is the fallback layout.
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Send apps to a home workspace on launch. Only apps installed on
# this machine are listed; add a block when a new one arrives.
# Find an app's id with: aerospace list-apps

# 1 Browsers
# Chromium is ungoogled-chromium, and the default handler for https.
[[on-window-detected]]
if.app-id = 'org.chromium.Chromium'
run = 'move-node-to-workspace 1'
[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 1'
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'

# 2 Terminals
# The always-on-top kitty window is floated wherever it lands. It has to be
# matched before the workspace rule, since the first matching callback wins.
[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
if.window-title-regex-substring = 'kitty-float'
run = 'layout floating'
[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = 'move-node-to-workspace 2'
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 2'

# 3 Code
[[on-window-detected]]
if.app-id = 'org.gnu.Emacs'
run = 'move-node-to-workspace 3'
[[on-window-detected]]
if.app-id = 'com.apple.dt.Xcode'
run = 'move-node-to-workspace 3'

# 4 Comms
[[on-window-detected]]
if.app-id = 'org.mozilla.thunderbird'
run = 'move-node-to-workspace 4'

# 5 AI
[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 5'

# 6 Docs / Notes
[[on-window-detected]]
if.app-id = 'com.zettlr.app'
run = 'move-node-to-workspace 6'

# 8 Virtualization
[[on-window-detected]]
if.app-id = 'com.utmapp.UTM'
run = 'move-node-to-workspace 8'

# 9 Games
[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam'
run = 'move-node-to-workspace 9'

# Keep Finder windows floating instead of tiled.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# An unbundled binary has no bundle id, so this matches on the executable name.
[[on-window-detected]]
if.app-name-regex-substring = 'sdl3-sandbox'
run = 'layout floating'

# Window gaps.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
# SketchyBar is 32px tall and replaces the hidden native menu bar.
outer.top = 40
outer.right = 8

# "mod" below means: hold the right diamond. "mod+shift" means diamond + Shift.
[mode.main.binding]

# Switch workspace.
cmd-ctrl-alt-1 = 'workspace 1'
cmd-ctrl-alt-2 = 'workspace 2'
cmd-ctrl-alt-3 = 'workspace 3'
cmd-ctrl-alt-4 = 'workspace 4'
cmd-ctrl-alt-5 = 'workspace 5'
cmd-ctrl-alt-6 = 'workspace 6'
cmd-ctrl-alt-7 = 'workspace 7'
cmd-ctrl-alt-8 = 'workspace 8'
cmd-ctrl-alt-9 = 'workspace 9'

# Move the focused window to a workspace.
cmd-ctrl-alt-shift-1 = 'move-node-to-workspace 1'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace 2'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace 3'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace 4'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace 5'
cmd-ctrl-alt-shift-6 = 'move-node-to-workspace 6'
cmd-ctrl-alt-shift-7 = 'move-node-to-workspace 7'
cmd-ctrl-alt-shift-8 = 'move-node-to-workspace 8'
cmd-ctrl-alt-shift-9 = 'move-node-to-workspace 9'

# Focus a window.
cmd-ctrl-alt-h = 'focus left'
cmd-ctrl-alt-j = 'focus down'
cmd-ctrl-alt-k = 'focus up'
cmd-ctrl-alt-l = 'focus right'

# Move a window in the tree.
cmd-ctrl-alt-shift-h = 'move left'
cmd-ctrl-alt-shift-j = 'move down'
cmd-ctrl-alt-shift-k = 'move up'
cmd-ctrl-alt-shift-l = 'move right'

# Change the layout.
cmd-ctrl-alt-e = 'layout tiles horizontal vertical'
cmd-ctrl-alt-s = 'layout accordion'
cmd-ctrl-alt-f = 'fullscreen'
cmd-ctrl-alt-shift-f = 'macos-native-fullscreen'

# Normalization rules out i3's split, so join the focused window with a
# neighbour instead. The neighbour's direction sets the new container.
cmd-ctrl-alt-v = 'mode join'

# Float the focused window.
cmd-ctrl-alt-shift-space = 'layout floating tiling'

# Summon the always-on-top terminal.
# AeroSpace has no always-on-top, so the window sets its own NSWindow level.
# See scripts/.local/bin/kitty-float.
cmd-ctrl-alt-enter = 'exec-and-forget $HOME/.local/bin/kitty-float'

# --- Resize the focused window. ---
cmd-ctrl-alt-minus = 'resize smart -50'
cmd-ctrl-alt-equal = 'resize smart +50'
cmd-ctrl-alt-0 = 'balance-sizes'
cmd-ctrl-alt-r = 'mode resize'

# Switch between the two most recent workspaces.
cmd-ctrl-alt-tab = 'workspace-back-and-forth'

# Cycle monitors and carry the focused window to the next display.
cmd-ctrl-alt-period = 'focus-monitor --wrap-around next'
cmd-ctrl-alt-shift-period = 'move-node-to-monitor --focus-follows-window --wrap-around next'

# Close the focused window, matching the i3 kill action.
cmd-ctrl-alt-q = 'close'
cmd-ctrl-alt-shift-c = 'reload-config'

# --- Service submode for housekeeping. ---
cmd-ctrl-alt-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']       # reset the split layout
backspace = ['close-all-windows-but-current', 'mode main']

[mode.join.binding]
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']
esc = 'mode main'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
